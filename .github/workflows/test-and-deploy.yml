name: Test Backend and Deploy Coverage

on:
  push:
    branches: [qa]
  pull_request:
    branches: [qa]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test-backend-deploy:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 1234
          POSTGRES_DB: billing_db_test
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    env:
      DATABASE_URL: postgresql://postgres:1234@localhost:5432/billing_db_test
      TZ: America/El_Salvador

    steps:
      # Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ./backend/package-lock.json

      # Install backend dependencies
      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci
      
      # Run backend tests
      - name: Generate Prisma client for test
        working-directory: ./backend
        run: npm run prisma:generate:test

      - name: Generate Prisma migrations for test
        working-directory: ./backend
        run: npm run prisma:migrate:test

      # Run tests with coverage and HTML report
      - name: Run backend tests with HTML & coverage
        working-directory: ./backend
        run: npm run test:run:html

      # Fix paths in HTML for GH Pages subpath
      - name: Fix coverage HTML paths for GH Pages
        working-directory: ./backend
        run: |
          find ./html/coverage -type f -name "*.html" -exec sed -i 's|href="/|href="./|g' {} +
          find ./html/coverage -type f -name "*.html" -exec sed -i 's|src="/|src="./|g' {} +
          find ./html/coverage -type f -name "*.js" -exec sed -i 's|"/|"./|g' {} +

      # Deploy coverage to GitHub Pages
      - name: Deploy coverage to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./backend/html
